<svg xmlns="http://www.w3.org/2000/svg" width="760" height="760" viewBox="0 0 760 760" role="img" aria-labelledby="title desc">
  <title id="title">Narrow Pull Request Files section wireframe</title>
  <desc id="desc">A constrained review tab with the diff kept visible and Files, Conversations, and Review controls exposed as drawers.</desc>
  <defs><style>
    .bg{fill:#171717}.panel{fill:#202020;stroke:#555}.active{fill:#343434}.line{stroke:#666}.text{fill:#eee;font:15px -apple-system,BlinkMacSystemFont,sans-serif}.small{fill:#aaa;font:12px -apple-system,BlinkMacSystemFont,sans-serif}.mono{fill:#ddd;font:13px ui-monospace,SFMono-Regular,monospace}.add{fill:#203c2b}.del{fill:#47252a}.accent{fill:#7aa2f7}
  </style></defs>
  <rect class="bg" width="760" height="760"/>
  <rect class="panel" x="20" y="20" width="720" height="720" rx="8"/>
  <text class="text" x="40" y="50">Fix session restore race  #3214</text>
  <line class="line" x1="20" y1="68" x2="740" y2="68"/>
  <rect class="active" x="38" y="80" width="66" height="28" rx="5"/><text class="text" x="54" y="100">Files</text>
  <text class="text" x="122" y="100">Activity</text><text class="text" x="210" y="100">Checks</text>
  <line class="line" x1="20" y1="118" x2="740" y2="118"/>
  <rect class="active" x="38" y="132" width="122" height="32" rx="5"/><text class="text" x="52" y="153">Files (12)  ⌄</text>
  <rect class="active" x="174" y="132" width="170" height="32" rx="5"/><text class="text" x="188" y="153">Conversations (2)</text>
  <text class="small" x="594" y="153">Viewed □</text>
  <rect class="panel" x="36" y="178" width="688" height="474"/>
  <text class="mono" x="54" y="204">Argus/Services/SessionStore.swift</text>
  <rect class="del" x="50" y="232" width="660" height="34"/><text class="mono" x="64" y="254">- saveOnTerminate()</text>
  <rect class="add" x="50" y="268" width="660" height="50"/><text class="mono" x="64" y="290">+ await reviewState.flush()</text><text class="mono" x="64" y="309">+ saveCodeSession()</text>
  <text class="mono" x="64" y="350">  func restore() async throws {</text><circle class="accent" cx="694" cy="344" r="7"/>
  <text class="small" x="52" y="632">Diff remains persistent; Files and Conversations open as drawers.</text>
  <line class="line" x1="20" y1="670" x2="740" y2="670"/>
  <text class="text" x="40" y="704">Review</text><text class="small" x="104" y="704">2 drafts · Comment</text>
  <rect class="active" x="590" y="682" width="130" height="34" rx="5"/><text class="text" x="606" y="704">Open summary</text>
</svg>
